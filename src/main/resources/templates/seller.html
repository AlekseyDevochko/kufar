<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${seller.fullName} + ' — продавец на Куфар'">Продавец</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<header class="header">
    <div class="container header-inner">
        <a th:href="@{/}" class="logo">Kufar</a>
        <div class="user-menu">
            <div sec:authorize="isAuthenticated()" class="user-authenticated">
                <a th:href="@{/cart}" class="header-cart">🛒 Корзина</a>
                <a th:href="@{/profile}" class="profile-link">
                    <span class="avatar" th:text="${#authentication.name.substring(0,1).toUpperCase()}">U</span>
                    <span class="username" th:text="${#authentication.name}">user</span>
                </a>
                <form th:action="@{/auth/logout}" method="post">
                    <button type="submit" class="btn-logout">Выйти</button>
                </form>
            </div>
            <div sec:authorize="!isAuthenticated()" class="user-anonymous">
                <a th:href="@{/auth/login}" class="btn-login">Войти</a>
                <a th:href="@{/auth/register}" class="btn-register">Регистрация</a>
            </div>
        </div>
    </div>
</header>

<main class="container dashboard">
    <a th:href="@{/}" class="back-link">← Назад к объявлениям</a>

    <!-- Карточка продавца (публичная, без кнопки "редактировать") -->
    <section class="profile-card">
        <div class="profile-avatar"
             th:text="${seller.fullName.substring(0,1).toUpperCase()}">U</div>
        <div class="profile-info">
            <h1 th:text="${seller.fullName}">Имя</h1>
            <p class="profile-username">@<span th:text="${seller.username}"></span></p>
            <ul class="profile-meta">
                <li>📍 <span th:text="${seller.city}"></span></li>
                <li th:if="${seller.registrationDate != null}">
                    📅 На сайте с
                    <span th:text="${#temporals.format(seller.registrationDate, 'MMMM yyyy')}"></span>
                </li>
                <li>📦 Объявлений: <strong th:text="${advertisements.size()}">0</strong></li>
            </ul>
        </div>
    </section>

    <h2 class="section-title">
        Объявления продавца
        <span class="badge" th:text="${advertisements.size()}">0</span>
    </h2>

    <div th:if="${advertisements.isEmpty()}" class="empty-state">
        <p class="empty-icon">📦</p>
        <p>У этого продавца пока нет активных объявлений.</p>
    </div>

    <div th:unless="${advertisements.isEmpty()}" class="products products--grid">
        <article th:each="ad : ${advertisements}" class="product-card">
            <a th:href="@{'/ads/' + ${ad.id}}" class="product-image-link">
                <div class="product-image">
                    <img th:if="${ad.images != null and !ad.images.isEmpty()}"
                         th:src="'data:' + ${ad.images[0].contentType} + ';base64,' + ${ad.images[0].base64Data}"
                         th:alt="${ad.title}">
                    <div th:if="${ad.images == null or ad.images.isEmpty()}" class="no-image">📷</div>
                </div>
            </a>
            <div class="product-info">
                <h3 class="product-title">
                    <a th:href="@{'/ads/' + ${ad.id}}" th:text="${ad.title}"></a>
                </h3>
                <p class="product-price" th:text="${ad.price} + ' BYN'"></p>
                <p class="product-city">📍 <span th:text="${ad.city}"></span></p>
                <p class="product-date"
                   th:text="${#temporals.format(ad.createdDate, 'dd.MM.yyyy HH:mm')}"></p>
            </div>
        </article>
    </div>
</main>

</body>
</html>
